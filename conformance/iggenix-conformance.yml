  - id: iso-idmp
    found: false
  - id: clinicaltrials-gov-prs
    found: false
  note: >-
    IgGenix runs clinical trials (Phase 1 ACCELERATE Peanut, IGNX001) and therefore participates in
    standards-bearing systems such as ClinicalTrials.gov, but it exposes no API into any of them. The
    only contract it serves is its CMS content API, which has no domain standard to conform to. Recorded
    as not-applicable — this is a reward-only dimension and IgGenix is not penalised for it.
