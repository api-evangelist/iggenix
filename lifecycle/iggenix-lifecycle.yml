  policy_url: null
  policy_published: false
  note: >-
    Version is a path namespace inherited from WordPress core. The full namespace list is discoverable at
    https://iggenix.com/wp-json/ (oembed/1.0, wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, wp/v2,
    wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1). IgGenix does not control or announce it.
