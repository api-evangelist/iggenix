summary: >-
  IgGenix publishes no API lifecycle posture of any kind — no versioning policy, no deprecation policy,
  no sunset headers, no SLA, no status page and no changelog. This is expected: it does not run a
  developer program, and the surface profiled here is the WordPress REST API its marketing site exposes
  incidentally. The version below is WordPress core's namespace, not an IgGenix contract.
