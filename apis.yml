aid: iggenix
name: IgGenix
description: 'IgGenix, Inc. is a clinical-stage antibody discovery and development company in South San
  Francisco, California, founded in 2019 on work from Stephen Quake''s laboratory at Stanford in
  collaboration with allergy clinician-researcher Kari Nadeau. Its SEQ SIFTER platform uses single-cell
  RNA sequencing to capture the rare IgE-producing B cells circulating in allergic patients'' blood, then
  re-engineers those sequences into fully human, high-affinity, allergen-specific IgG antibodies designed
  to block the allergic cascade before it starts. Lead program IGNX001 is a human IgG4 monoclonal antibody
  for peanut allergy, in the Phase 1 ACCELERATE Peanut trial, with discovery programs against alpha-gal
  syndrome, nsLTP allergens and atopic dermatitis autoantigens. The company has raised roughly $75M across
  seed, Series A and a $40M Series B. IgGenix publishes no product or developer API and no developer
  program; the only machine-readable surface on iggenix.com is the WordPress REST API (wp/v2) served at
  https://iggenix.com/wp-json/, which returns the company''s press releases, peer-reviewed publications,
  conference abstracts, careers post type, pages, media library, taxonomies and site search as anonymous
  JSON. The OpenAPI definitions in this repository were derived mechanically from that route index; IgGenix
  publishes none of its own.'
