  request: 'GET https://iggenix.com/wp-json/wp/v2/settings'
  status: 401
  response: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
  description: >-
    Returned with no WWW-Authenticate header. The same body and status come back from
    /wp-json/wp-abilities/v1/abilities.
- name: oEmbed rejects an archive URL
  request: 'GET https://iggenix.com/wp-json/oembed/1.0/embed?url=https%3A%2F%2Figgenix.com%2Fpublications%2F'
